<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/general.css">
    <link rel="stylesheet" href="styles/homepage.css">
    <script src="scripts/homepage.js"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTU GPA Calculator</title>
</head>
<body>
    <div class="header">
        <p class="heading">KTU GPA Calculator 2019 Scheme</p>
    </div>

    <div class="instr-div">
      <p class="instruction">Select your branch :</p>
    </div>

    <div class="branches">
        <button class="branch" data-branch="CSE">
            <p class="branch-name">Computer Science and Engineering</p>
        </button>

        <button class="branch" data-branch="ECE">
            <p class="branch-name">Electronics and Communication Engineering</p>
        </button>

        <button class="branch" data-branch="CIVIL">
            <p class="branch-name">Civil Engineering</p>
        </button>

        <button class="branch" data-branch="EEE">
            <p class="branch-name">Electrical and Electronics Engineering</p>
        </button>

        <button class="branch" data-branch="MECH">
            <p class="branch-name">Mechanical Engineering</p>
        </button>

        <button class="branch" data-branch="ICE">
            <p class="branch-name">Instrumentation and Control Engineering</p>
        </button>

        <button class="branch" data-branch="AIDS">
            <p class="branch-name">Artificial Intelligence and Data Science</p>
        </button>

        <button class="branch" data-branch="OTHERS" id="other-btn">
            <p class="branch-name">Other Departments / Programs</p>
        </button>

    </div>
</body>
</html>
